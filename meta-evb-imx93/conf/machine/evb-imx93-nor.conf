#@TYPE: Machine
#@NAME: imx93 Development Board - NOR Flash boot (64bit)
#@DESCRIPTION: Machine configuration for the imx93 booting from SPI NOR (FlexSPI)

# Base on the SD/eMMC evb-imx93 machine and override NOR-specific settings
require conf/machine/evb-imx93.conf

# -----------------------------------------------------------------
# Boot container: use FlexSPI target so imx-mkimage produces
# a flash.bin suitable for programming onto SPI NOR.
# NOR flash boot is supported on the iMX93 EVK board only (not FRDM).
# -----------------------------------------------------------------
UBOOT_CONFIG = "fspi"
UBOOT_CONFIG[fspi] = "imx93_11x11_evk_defconfig,,"
NO_RECOMMENDATIONS = "1"

# EVK DTB for NOR boot
UBOOT_DTB_NAME = "imx93-11x11-evk-bmc-host.dtb"
KERNEL_DEVICETREE:append = " freescale/imx93-11x11-evk-bmc-host.dtb"
# -----------------------------------------------------------------
# Rootfs: JFFS2 for NOR flash; drop block-device WIC images.
# JFFS2 erase block size must match the kernel MTD erase block.
# CONFIG_MTD_SPI_NOR_USE_4K_SECTORS is disabled so the kernel uses
# 64 KB erase blocks (0x10000).
# -----------------------------------------------------------------
IMAGE_FSTYPES = "jffs2"
EXTRA_IMAGECMD:jffs2 = "--pad --no-cleanmarkers --eraseblock=0x10000"
NOR_KERNEL_IMAGETYPE  = "Image.gz"
KERNEL_IMAGETYPES = "Image.gz"

# No WIC partition layout needed for raw MTD NOR boot
WKS_FILE = ""
WKS_FILE_DEPENDS = ""

# Mark this machine so NOR-specific bbappend overrides apply
MACHINEOVERRIDES =. "evb-imx93-nor:"

# Enable rootfs size reduction for NOR flash production builds.
# NOTE: DISTRO_FEATURES is normally set at the distro level, but this
# feature is set here intentionally because NOR size reduction is tied
# to the evb-imx93-nor hardware constraint (39.75 MB rootfs partition).
# To build a debug image with all tools, add to local.conf:
#   DISTRO_FEATURES:remove = "nor-size-reduction"
DISTRO_FEATURES:append = " nor-size-reduction"

# -----------------------------------------------------------------
# NOR partition layout variables - referenced by image_types_nor.bbclass
# and must stay consistent with:
#   - U-Boot env (custom-bmc-env-nor.cmd)
#   - Kernel DTS MTD partition node (frdm-bmc DTS patch)
# Layout (from kernel DTS fixed-partitions, after size reduction):
#   u-boot  0x0000000  0x002C0000 (2.75 MB)   imx-boot container
#   kernel  0x002C0000 0x01000000 (16 MB)     Linux kernel Image.gz
#   dtb     0x012C0000 0x00080000 (512 KB)    device-tree blobs
#   rootfs  0x01340000 0x027C0000 (39.75 MB)  JFFS2 root filesystem
#   total   0x3B00000  (~59 MB)
# -----------------------------------------------------------------
# NOR_FLASH_SIZE represents the used layout size (not the full 64 MB
# physical flash).  image_types_nor.bbclass uses this to size the
# consolidated NOR image.  JFFS2 GC operates within the rootfs
# partition; --pad ensures proper alignment.
NOR_FLASH_SIZE    = "0x03B00000"
NOR_OFFSET_BOOT   = "0x00000000"
NOR_OFFSET_KERNEL = "0x002C0000"
NOR_OFFSET_DTB    = "0x012C0000"
NOR_OFFSET_ROOTFS = "0x01340000"
