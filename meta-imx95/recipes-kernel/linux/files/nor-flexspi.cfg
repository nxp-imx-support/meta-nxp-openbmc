# Kernel config fragment for NOR flash (FlexSPI) boot on iMX95 BMC
#
# The base imx_openbmc_defconfig already enables:
#   CONFIG_MTD=y
#   CONFIG_MTD_SPI_NOR=y
#   CONFIG_JFFS2_FS=y
#
# This fragment adds the NXP FlexSPI host controller driver and
# supporting options required for actual NOR device probing.

# NXP FlexSPI host controller driver (i.MX FlexSPI peripheral)
CONFIG_SPI_NXP_FSPI=y

# Expose the parent MTD device so all partitions are accessible
CONFIG_MTD_PARTITIONED_MASTER=y

# Use 4 KB sub-sectors for fine-grained erasing where the chip supports it
CONFIG_MTD_SPI_NOR_USE_4K_SECTORS=y

# MTD char device interface (/dev/mtd0, /dev/mtd1 ...)
CONFIG_MTD_CHAR=y

# SPI framework requirements
CONFIG_SPI=y
CONFIG_SPI_MEM=y
CONFIG_SPI_MASTER=y
