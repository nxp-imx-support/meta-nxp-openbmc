# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

LAYERSERIES_COMPAT_meta_evb_imx95_evk = "walnascar wrynose whinlatter"

BBFILE_COLLECTIONS += "meta_evb_imx95_evk"
BBFILE_PATTERN_meta_evb_imx95_evk = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta_evb_imx95_evk = "7"
