# /etc/kvm.conf

# KVM operating mode
#
# pcie_video_usb_hid
#   - Video over PCIe
#   - Keyboard over USB HID
#   - Mouse over USB HID
#
# pcie_kvm
#   - Video over PCIe
#   - Keyboard over PCIe HID
#   - Mouse over PCIe HID
#
kvm_mode=pcie_video_usb_hid

# Display resolution
#
# Supported values:
#   1080p - Advertise 1920x1080 EDID
#   4k    - Advertise 3840x2160 EDID
#
# Notes:
# - If 4k is selected and the hardware/monitor supports 4K,
#   the EPF advertises the default 4K EDID.
# - Otherwise, it automatically falls back to the default
#   1920x1080 EDID.
#
display_resolution=1080p
