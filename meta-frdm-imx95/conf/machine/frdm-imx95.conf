#@TYPE: Machine
#@NAME: imx95 Development Board (64bit)
#@DESCRIPTION: Machine configuration for the imx95 in 64 bits mode

include conf/machine/include/nxp.inc
include conf/machine/imx95-15x15-lpddr4x-frdm.conf

RPI_KERNEL_DEVICETREE = " \
    freescale/${KERNEL_DEVICETREE} \
"
KSOC = "imx95"
KBOARD = "frdm"
KPKG = "15x15"
CONFIG_BASENAME = "${KSOC}_${KPKG}_${KBOARD}"
DTB_BASENAME = "${KSOC}-${KPKG}-${KBOARD}"

SDIMG_KERNELIMAGE ?= "kernel8.img"

SERIAL_CONSOLES ?= "115200;ttyLP0"
SYSTEMD_AUTO_ENABLE = "enable"

IMAGE_INSTALL:append = " pldm pldmtool libmctp mctp"

WKS_FILE = "obmc-phosphor-image.frdm-${KSOC}.wks"
# Accept NXP firmware EULA (needed to fetch ELE/DDR blobs)
ACCEPT_FSL_EULA = "1"

UBOOT_CONFIG_BASENAME = "${CONFIG_BASENAME}"
UBOOT_DTB_NAME = "${DTB_BASENAME}-bmc.dtb"
IMAGE_BOOT_FILES = "u-boot.bin Image ${@' '.join([dtb.split('/')[-1] for dtb in d.getVar('KERNEL_DEVICETREE').split()])} tee.bin"
BOOTIMG_DIR = "${DEPLOY_DIR_IMAGE}"

# Let U-Boot provide a boot container (flash.bin) instead of imx-boot
UBOOT_PROVIDES_BOOT_CONTAINER = "1"

MACHINEOVERRIDES =. "nxp:"

# Accept NXP firmware EULA (needed to fetch ELE/DDR blobs)

# Make imx-boot depend on the ELE firmware recipe
IMX_EXTRA_FIRMWARE = "firmware-ele-imx"
SECO_FIRMWARE_NAME = "mx95b0-ahab-container.img"

# Treat frdm-imx95 like an mx9-generic-bsp for recipe overrides/compatibility:
MACHINEOVERRIDES:append = ":mx9-generic-bsp:mx95-generic-bsp:mx95-nxp-bsp:imx-nxp-bsp"
SYSTEM_MANAGER_CONFIG = "mx95evk"

# IMXBOOT_VARIANT is only a keyword selector (alt/jailhouse/netc/rpmsg/sof);
# setting it to "flash_a55" matches none of those keywords, so IMXBOOT_TARGETS
# still falls through to its default "flash_all flash_a55". The flash_all rule
# in iMX95/soc.mak requires m7_image.bin (from mcore-demos), which is not built
# in a BMC-only image, so make fails with "No rule to make target m7_image.bin".
# Override IMXBOOT_TARGETS directly so only the A55 boot container is built.
IMXBOOT_TARGETS = "flash_a55"

# "zImage" not supported on arm64 and ".gz" images not supported by bootloader yet
KERNEL_IMAGETYPE_DIRECT ?= "Image"
KERNEL_BOOTCMD ?= "booti"

ARMSTUB ?= "armstub8-gic.bin"

# Select implementations for OpenBMC management virtuals
VIRTUAL-RUNTIME_obmc-system-mgmt  ?= "phosphor-state-manager"
VIRTUAL-RUNTIME_obmc-chassis-mgmt ?= "phosphor-state-manager"
VIRTUAL-RUNTIME_obmc-host-mgmt    ?= "phosphor-state-manager"
# Remove DTBs not present in lf-6.18.2-1.0.0 (camera ISP DTBs added later)
KERNEL_DEVICETREE:remove = " \
    freescale/imx95-15x15-frdm-dual-os08a20-isp.dtb \
    freescale/imx95-15x15-frdm-os08a20-combo-isp.dtb \
    freescale/imx95-15x15-frdm-os08a20-isp.dtb \
"


# BMC DTB derived from DTB_BASENAME (imx95-15x15-frdm-bmc.dtb)
KERNEL_DEVICETREE:append = " freescale/${DTB_BASENAME}-bmc.dtb"

# QSPI mailbox DTB - built and shipped, but NOT booted by default.
KERNEL_DEVICETREE:append = " freescale/${DTB_BASENAME}-mailbox-mock.dtb"

WKS_FILE_DEPENDS += "imx-boot"


IMAGE_INSTALL:append = " v4l-utils"

# Bridge the enclosure_identify LED group (WebUI identify toggle / id-button)
# onto the OBMF virtual gpiochip line, which is not a /sys/class/leds device.
#
# Gated on BMC_LINUX_USE_INTERNAL for the same reason as on frdm-imx93: the
# bridge needs the "obmf-gpio" gpiochip that obmf-driver creates, and that
# driver is only installed for the internal kernel. Left ungated, and with no
# such chip present, obmf-led-bridge.sh falls back to a hard-coded "gpiochip6"
# and drives line 0 of whatever controller happens to sit at that index.
IMAGE_INSTALL:append = " ${@bb.utils.contains('BMC_LINUX_USE_INTERNAL', '1', 'obmf-led-bridge', '', d)}"

# Remove M7 demo binaries - no mcore-demos recipe in a BMC-only build.
# These are appended by imx95-15x15-lpddr4x-frdm.conf and would cause
# do_image_wic to fail with "cannot stat ... No such file or directory".
IMAGE_BOOT_FILES:remove = " \
    mcore-demos/imx95-15x15-evk_m7_TCM_power_mode_switch.bin \
    mcore-demos/imx95-15x15-evk_m7_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    mcore-demos/imx95-15x15-evk_m7_TCM_rpmsg_lite_str_echo_rtos.bin \
    mcore-demos/imx95-15x15-evk_m7_TCM_sai_low_power_audio.bin \
"
