#@TYPE: Machine
#@NAME: imx91 Development Board (64bit)
#@DESCRIPTION: Machine configuration for the imx91 in 64 bits mode

DEFAULTTUNE = "cortexa55"

include conf/machine/include/imx91.inc
include conf/machine/imx91frdm.conf

RPI_KERNEL_DEVICETREE = " \
    freescale/${KERNEL_DEVICETREE} \
"

SDIMG_KERNELIMAGE ?= "kernel8.img"

SERIAL_CONSOLES ?= "115200;ttyLP0"
SYSTEMD_AUTO_ENABLE = "enable"
IMAGE_INSTALL:append = " pldm pldmtool libmctp mctp"

WKS_FILE = "obmc-phosphor-image.evb-${KSOC}.wks"
ACCEPT_FSL_EULA = "1"

ATF_PLATFORM = "${KSOC}"

# In each NXP machine conf
MACHINEOVERRIDES =. "nxp:"

# "zImage" not supported on arm64 and ".gz" images not supported by bootloader yet
KERNEL_IMAGETYPE_DIRECT ?= "Image"
KERNEL_BOOTCMD ?= "booti"

# ARM64 kernel image type
KERNEL_IMAGETYPE:forcevariable = "Image"

# Generate fitImage for OpenBMC/NXP boot flow
KERNEL_IMAGETYPES += "fitImage"

# Enable FIT image builder
KERNEL_CLASSES += "kernel-fitimage"

ARMSTUB ?= "armstub8-gic.bin"

VIRTUAL-RUNTIME_obmc-gpio-monitor = "obmc-gpio-monitor"

PREFERRED_PROVIDER_virtual/phosphor-led-manager-config-native = "imx-led-manager-config-native"
PREFERRED_PROVIDER_virtual/openpower-occ-control-config-native = "imx-occ-control-config-native"

# Select implementations for OpenBMC management virtuals
VIRTUAL-RUNTIME_obmc-system-mgmt  ?= "phosphor-state-manager"
VIRTUAL-RUNTIME_obmc-chassis-mgmt ?= "phosphor-state-manager"
VIRTUAL-RUNTIME_obmc-host-mgmt    ?= "phosphor-state-manager"

WKS_FILE_DEPENDS += "imx-boot"

MACHINE_FEATURES:remove = "optee"
DEPLOY_OPTEE:evb-imx91 = "false"
DEPLOY_OPTEE_STMM:evb-imx91 = "false"

MACHINEOVERRIDES =. "mx91:mx91-generic-bsp:"

SOC_FAMILY = "mx91"
IMXBOOT_TARGETS = "flash_singleboot"

# Scoped to this MACHINE only
UBOOT_CONFIG_BASENAME:evb-imx91 = "imx91_11x11_evk"
UBOOT_DTB_NAME:evb-imx91        = "imx91-11x11-evk.dtb"
IMX_DEFAULT_BOOTLOADER:use-nxp-bsp = "u-boot-imx"
IMX_DEFAULT_BOOTLOADER:use-mainline-bsp = "u-boot-fslc"

DDR_FIRMWARE_NAME:evb-imx91 = " \
    lpddr4_dmem_1d_v202201.bin \
    lpddr4_dmem_2d_v202201.bin \
    lpddr4_imem_1d_v202201.bin \
    lpddr4_imem_2d_v202201.bin \
"

IMX_BOOT_SOC_TARGET = "iMX91"
IMX_BOOT_SEEK = "32"
