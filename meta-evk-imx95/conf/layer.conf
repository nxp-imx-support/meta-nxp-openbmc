# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

LAYERSERIES_COMPAT_meta_evk_imx95 = "walnascar wrynose whinlatter"

BBFILE_COLLECTIONS += "meta_evk_imx95"
BBFILE_PATTERN_meta_evk_imx95 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta_evk_imx95 = "7"
