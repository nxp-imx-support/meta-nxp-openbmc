#@TYPE: Machine
#@NAME: imx95 EVK - NOR Flash boot (64bit)
#@DESCRIPTION: Machine configuration for the imx95 19x19 EVK booting from SPI NOR (FlexSPI1)

# Base on the SD/eMMC evk-imx95 machine and override NOR-specific settings
require conf/machine/evk-imx95.conf

# -----------------------------------------------------------------
# Boot container: use FlexSPI target so imx-mkimage produces
# a flash.bin suitable for programming onto SPI NOR.
# -----------------------------------------------------------------
UBOOT_CONFIG = "fspi"
UBOOT_CONFIG[fspi] = "imx95_19x19_evk_defconfig,,"

# -----------------------------------------------------------------
# Rootfs: JFFS2 for NOR flash; drop block-device WIC images.
# JFFS2 erase block size must match the NOR flash erase block
# (0x10000 = 64 KB, typical for SPI NOR devices).
# -----------------------------------------------------------------
IMAGE_FSTYPES = "jffs2"
EXTRA_IMAGECMD:jffs2 = "--pad --no-cleanmarkers --eraseblock=0x10000"

IMXBOOT_TARGETS="flash_a55_flexspi"

# No WIC partition layout needed for raw MTD NOR boot
WKS_FILE = ""
WKS_FILE_DEPENDS = ""

# Mark this machine so NOR-specific bbappend overrides apply
MACHINEOVERRIDES =. "evk-imx95-nor:"

# -----------------------------------------------------------------
# NOR partition layout variables - referenced by image_types_nor.bbclass
# and must stay consistent with:
#   - U-Boot env (custom-bmc-env-nor.cmd)
#   - Kernel DTS MTD partition node
# -----------------------------------------------------------------
NOR_FLASH_SIZE    = "0x02000000"
NOR_OFFSET_BOOT   = "0x00000000"
NOR_OFFSET_KERNEL = "0x00400000"
NOR_OFFSET_DTB    = "0x00C00000"
NOR_OFFSET_ROOTFS = "0x00D00000"
