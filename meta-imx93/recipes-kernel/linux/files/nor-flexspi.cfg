# Kernel config fragment for NOR flash (FlexSPI) boot on iMX93 BMC
#
# The base imx_openbmc_defconfig already enables:
#   CONFIG_MTD=y
#   CONFIG_MTD_SPI_NOR=y
#   CONFIG_JFFS2_FS=y
#
# This fragment adds the NXP FlexSPI host controller driver and
# supporting options required for actual NOR device probing.

# NXP FlexSPI host controller driver (i.MX FlexSPI peripheral)
CONFIG_SPI_NXP_FSPI=y

# Expose the parent MTD device so all partitions are accessible.
# With this enabled, rootfs is /dev/mtdblock4 (mtdblock0 = full NOR).
CONFIG_MTD_PARTITIONED_MASTER=y

# Use standard 64 KB erase blocks (not 4 KB sub-sectors) to match
# the JFFS2 image built with --eraseblock=0x10000.
# The mt25qu512a on iMX93 EVK supports 4K sub-sectors, but JFFS2
# does not work reliably with 4KB erase blocks.
# CONFIG_MTD_SPI_NOR_USE_4K_SECTORS is not set

# MTD char device interface (/dev/mtd0, /dev/mtd1 ...)
CONFIG_MTD_CHAR=y

# SPI framework requirements
CONFIG_SPI=y
CONFIG_SPI_MEM=y
CONFIG_SPI_MASTER=y
