# FlexSPI NOR boot configuration for iMX93 BMC
#
# This fragment is applied on top of imx93_11x11_frdm_defconfig when
# building the fspi UBOOT_CONFIG variant (NOR flash boot).

# Default DTB for BMC - iMX93 EVK board (NOR flash boot supported on EVK only)
CONFIG_DEFAULT_FDT_FILE="imx93-11x11-evk-bmc-host.dtb"

# Enable SPI NOR flash support
CONFIG_SPI=y
CONFIG_DM_SPI=y
CONFIG_SPI_MEM=y
CONFIG_NXP_FSPI=y
CONFIG_SPI_FLASH=y
CONFIG_SPI_FLASH_SFDP_SUPPORT=y
CONFIG_SPI_FLASH_MACRONIX=y
CONFIG_SPI_FLASH_MICRON=y
CONFIG_SPI_FLASH_SPANSION=y
CONFIG_SPI_FLASH_STMICRO=y
CONFIG_SPI_FLASH_WINBOND=y
CONFIG_SPI_FLASH_MTD=y

# Store U-Boot environment in SPI NOR flash
# Env must reside within the boot partition (0x0-0x002BFFFF, 2.75 MB)
# to avoid overwriting the kernel partition on saveenv.
# Two 64 KB blocks at the end of the boot partition:
#   env:        0x002A0000 - 0x002AFFFF
#   env_redund: 0x002B0000 - 0x002BFFFF
CONFIG_ENV_IS_IN_SPI_FLASH=y
CONFIG_ENV_OFFSET=0x2A0000
CONFIG_ENV_SECT_SIZE=0x10000
CONFIG_ENV_SIZE=0x10000

# Redundant environment copy for reliability
CONFIG_ENV_OFFSET_REDUND=0x2B0000

# Enable unzip command (used by bootcmd to decompress Image.gz)
CONFIG_CMD_UNZIP=y

# MTD support for NOR flash partition access
CONFIG_MTD=y
CONFIG_DM_MTD=y
CONFIG_MTD_SPI_NAND=n

# Boot from FlexSPI (not from MMC by default)
# CONFIG_BOOTDEV_MMC is not set
