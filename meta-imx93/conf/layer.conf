# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

LAYERSERIES_COMPAT_meta_imx93 = "walnascar wrynose whinlatter"

BBFILE_COLLECTIONS += "meta_imx93"
BBFILE_PATTERN_meta_imx93 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta_imx93 = "7"
