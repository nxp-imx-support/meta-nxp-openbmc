#@TYPE: Machine
#@NAME: imx943 Development Board (64bit)
#@DESCRIPTION: Machine configuration for the imx943 in 64 bits mode

include conf/machine/include/nxp.inc
include conf/machine/imx943-15x15-lpddr4-evk.conf

RPI_KERNEL_DEVICETREE = " \
    freescale/${KERNEL_DEVICETREE} \
"
KSOC = "imx943"
KBOARD = "dc-scm"
KPKG = "15x15"
CONFIG_BASENAME = "${KSOC}_${KBOARD}"
DTB_BASENAME = "${KSOC}-${KBOARD}"

SDIMG_KERNELIMAGE ?= "kernel8.img"

SERIAL_CONSOLES ?= "115200;ttyLP0"
SYSTEMD_AUTO_ENABLE = "enable"

IMAGE_INSTALL:append = " pldm pldmtool libmctp mctp"

WKS_FILE = "obmc-phosphor-image.evb-${KSOC}.wks"
# Accept NXP firmware EULA (needed to fetch ELE/DDR blobs)
ACCEPT_FSL_EULA = "1"

# The upstream u-boot-imx source tree has no imx943_dc-scm_defconfig.
# Use the standard EVK defconfig as the base; the board-specific DTB
# (imx943-dc-scm.dtb) is applied via defconfig-fragment.cfg.
UBOOT_CONFIG_BASENAME = "imx943_evk"
UBOOT_DTB_NAME = "${DTB_BASENAME}.dtb"
IMAGE_BOOT_FILES = "u-boot.bin Image ${@' '.join([dtb.split('/')[-1] for dtb in d.getVar('KERNEL_DEVICETREE').split()])} tee.bin"
BOOTIMG_DIR = "${DEPLOY_DIR_IMAGE}"

# Let U-Boot provide a boot container (flash.bin) instead of imx-boot
UBOOT_PROVIDES_BOOT_CONTAINER = "1"

MACHINEOVERRIDES =. "nxp:"

# Extend MACHINEOVERRIDES for SoC-specific recipe overrides
MACHINEOVERRIDES:append = ":mx9-generic-bsp:mx943-generic-bsp:mx943-nxp-bsp:imx-nxp-bsp"

# System manager firmware for iMX943
SYSTEM_MANAGER_FIRMWARE_BASENAME = "m33_image"
SYSTEM_MANAGER_CONFIG = "mx94-dc-scm"

# "zImage" not supported on arm64 and ".gz" images not supported by bootloader yet
KERNEL_IMAGETYPE_DIRECT ?= "Image"
KERNEL_BOOTCMD ?= "booti"

ARMSTUB ?= "armstub8-gic.bin"

# Select implementations for OpenBMC management virtuals
VIRTUAL-RUNTIME_obmc-system-mgmt  ?= "phosphor-state-manager"
VIRTUAL-RUNTIME_obmc-chassis-mgmt ?= "phosphor-state-manager"
VIRTUAL-RUNTIME_obmc-host-mgmt    ?= "phosphor-state-manager"

# BMC DTB derived from DTB_BASENAME (imx943-dc-scm)
KERNEL_DEVICETREE:append = " freescale/${DTB_BASENAME}.dtb"
WKS_FILE_DEPENDS += "imx-boot"

KERNEL_DEVICETREE:append = " freescale/imx943-dc-scm.dtb "

# QSPI mailbox DTB - built and shipped, but NOT booted by default.
KERNEL_DEVICETREE:append = " freescale/${DTB_BASENAME}-mailbox-mock.dtb"


UBOOT_LOADADDRESS = "0x94000000"
UBOOT_ENTRYPOINT = "0x94000000"

FLASH_SIZE = "131072"
FLASH_UBOOT_SPL_SIZE = "256"
FLASH_UBOOT_ENV_OFFSET:flash-131072 = "2048"
FLASH_KERNEL_OFFSET:flash-131072 ?= "3072"
FLASH_ROFS_OFFSET:flash-131072 ?= "20480"
FLASH_RWFS_OFFSET:flash-131072 ?= "102400"

UBOOT_CONFIG:append = " xspi"
IMXBOOT_TARGETS:append = " ${@bb.utils.contains('UBOOT_CONFIG', 'xspi', 'flash_a55', '', d)}"

# NOR flash partition layout - must match the kernel DTS fixed-partitions
# node in imx943-dc-scm.dts and the U-Boot environment.
#
# Layout (from kernel DTS patch 0001-Create-paritions-in-flash-for-NOR-boot.patch):
#   u-boot   0x00000000  0x002E0000 (~2.8 MB)   imx-boot container
#   kernel   0x002E0000  0x02300000 (~35 MB)    Linux kernel Image
#   dtb      0x025E0000  0x00020000 (128 KB)    imx943-dc-scm.dtb
#   rootfs   0x02600000  0x03C00000 (~60 MB)    JFFS2 root filesystem
#   total    0x06200000  (~98 MB)
NOR_FLASH_SIZE    = "0x06200000"
NOR_OFFSET_BOOT   = "0x00000000"
NOR_OFFSET_KERNEL = "0x002E0000"
NOR_OFFSET_DTB_0  = "0x025E0000"
NOR_OFFSET_DTB_1  = "0x025E0000"
NOR_OFFSET_DTB_2  = "0x025E0000"
NOR_OFFSET_DTB_3  = "0x025E0000"
NOR_DTB_SLOT_SIZE = "0x20000"
NOR_OFFSET_ROOTFS = "0x02600000"

NOR_DTB_0_NAME    = "imx943-dc-scm.dtb"
NOR_DTB_1_NAME    = "imx943-dc-scm.dtb"
NOR_DTB_2_NAME    = "imx943-dc-scm.dtb"
NOR_DTB_3_NAME    = "imx943-dc-scm.dtb"

NOR_BOOT_BIN         = "${DEPLOY_DIR_IMAGE}/imx-boot-${MACHINE}-xspi.bin-flash_a55_xspi"
NOR_KERNEL_IMAGETYPE = "Image"
