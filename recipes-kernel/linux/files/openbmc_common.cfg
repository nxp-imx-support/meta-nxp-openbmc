# iKVM video capture (stream2v4l2) depends on the i.MX9 PCI EP VGA driver
# (pci_epf_get_vram_fb_address), which only exists on mx95/mx943 where the
# iKVM PCIe EP patches and CONFIG_PCI_EPF_IMX9_VGA are enabled. Disable it here
# so imx91/imx93 (BMC-only, no iKVM) do not fail to link the module. It is
# re-enabled in openbmc_imx943_imx95.cfg for the platforms that provide the symbol.
# CONFIG_VIDEO_STREAM2V4L2 is not set

# iMX9 QSPI mailbox driver (FPGA sensor/GPIO gateway over FlexSPI). Built as a
# module. Mock transport is enabled so the driver runs against scripted FPGA
# responses (no MachXO5-T hardware required) using the mailbox-mock DT overlay.
#
# The driver computes both its CRC-8/SMBUS header checksum and its
# CRC-16/CCITT-FALSE payload checksum locally (self-contained MSB-first bit
# loops in core.c). It deliberately does NOT use the kernel lib/crc8.c helpers:
# CONFIG_CRC8 is a promptless tristate that is not built in every kernel
# configuration, so referencing crc8()/crc8_populate_msb() would leave the
# out-of-tree module unresolvable at modpost time on kernels that did not build
# the CRC8 library. Keeping the CRC math in the driver needs no kernel option.
CONFIG_IMX9_QSPI_MB=m

CONFIG_IMX9_QSPI_MB_MOCK=y
CONFIG_IMX9_QSPI_MB_USPACE=y

