# OpenBMC common kernel config for all iMX9x platforms
# Delta over expanded imx_v8_defconfig for lf-6.18.2-1.0.0
#

# Enabled / changed options
CONFIG_IMX_THERMAL=y
# iMX91/93 System Controller and Thermal
CONFIG_IMX_SC=y
CONFIG_IMX_SC_PM_DOMAINS=y
CONFIG_IMX_SC_POWER_DOMAIN=y
CONFIG_IMX_THERMAL2=y
CONFIG_MCTP=y
CONFIG_MCTP_FLOW_CONTROL=y
CONFIG_MCTP_NETLINK=y
CONFIG_MCTP_PCI=y
CONFIG_MCTP_PCI_TRANSPORT=y
CONFIG_MCTP_ROUTING=y
CONFIG_MCTP_SMBUS=y
CONFIG_MCTP_SMBUS_TRANSPORT=y
CONFIG_MCTP_SOCKETS=y
CONFIG_MCTP_TRANSPORTS=y

# Explicitly disabled (size/security reduction vs base)
# CONFIG_QORIQ_THERMAL is not set

CONFIG_MCTP_SERIAL=y
CONFIG_MCTP_TRANSPORT_I2C=y
CONFIG_MCTP_TRANSPORT_USB=y

CONFIG_SENSORS_LM75=y
CONFIG_SENSORS_TMP108=y

