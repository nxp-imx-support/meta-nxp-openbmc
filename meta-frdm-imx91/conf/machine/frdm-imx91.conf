#@TYPE: Machine
#@NAME: imx91 Development Board (64bit)
#@DESCRIPTION: Machine configuration for the imx91 in 64 bits mode

include conf/machine/include/nxp.inc
include conf/machine/imx91-11x11-lpddr4-evk.conf

RPI_KERNEL_DEVICETREE = " \
    freescale/${KERNEL_DEVICETREE} \
"
KSOC = "imx91"
KBOARD = "frdm"
KPKG = "11x11"
CONFIG_BASENAME = "${KSOC}_${KPKG}_${KBOARD}"
DTB_BASENAME = "${KSOC}-${KPKG}-${KBOARD}"

SDIMG_KERNELIMAGE ?= "kernel8.img"

SERIAL_CONSOLES ?= "115200;ttyLP0"
SYSTEMD_AUTO_ENABLE = "enable"

IMAGE_INSTALL:append = " pldm pldmtool libmctp mctp"

WKS_FILE = "obmc-phosphor-image.evb-${KSOC}.wks"
ACCEPT_FSL_EULA = "1"

UBOOT_CONFIG_BASENAME = "${CONFIG_BASENAME}"
UBOOT_DTB_NAME = "${DTB_BASENAME}-bmc.dtb"
IMAGE_BOOT_FILES = "u-boot.bin Image ${@' '.join([dtb.split('/')[-1] for dtb in d.getVar('KERNEL_DEVICETREE').split()])}"
BOOTIMG_DIR = "${DEPLOY_DIR_IMAGE}"

IMX_BOOT_SOC_TARGET = "iMX91"

MACHINEOVERRIDES =. "nxp:"

# Extend MACHINEOVERRIDES for SoC-specific recipe overrides
MACHINEOVERRIDES:append = ":mx9-generic-bsp:mx91-generic-bsp:mx91-nxp-bsp:imx-nxp-bsp"

# Explicitly set AHAB firmware name for imx91 (A0 silicon)
SECO_FIRMWARE_NAME = "mx91a0-ahab-container.img"

# imx-base.inc sets MACHINE_FEATURES with 'optee' by default, which causes
# imx-boot to require optee-os. optee-os is not COMPATIBLE_MACHINE for
# frdm-imx91 (no use-nxp-bsp override). Remove it for BMC-only build.
MACHINE_FEATURES:remove = "optee"

# "zImage" not supported on arm64 and ".gz" images not supported by bootloader yet
KERNEL_IMAGETYPE_DIRECT ?= "Image"
KERNEL_BOOTCMD ?= "booti"

ARMSTUB ?= "armstub8-gic.bin"

# Select implementations for OpenBMC management virtuals
VIRTUAL-RUNTIME_obmc-system-mgmt  ?= "phosphor-state-manager"
VIRTUAL-RUNTIME_obmc-chassis-mgmt ?= "phosphor-state-manager"
VIRTUAL-RUNTIME_obmc-host-mgmt    ?= "phosphor-state-manager"

# BMC DTB derived from DTB_BASENAME (imx91-11x11-frdm-bmc.dtb)
KERNEL_DEVICETREE:append = " freescale/${DTB_BASENAME}-bmc.dtb"
# Remove BSP DTBs not present in lf-6.18.2-1.0.0
KERNEL_DEVICETREE:remove = " \
    freescale/${KERNEL_DEVICETREE_BASENAME}-aud-hat.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-flexspi-m2.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-flexspi-nand-m2.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-i2c-spi-slave.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-i3c.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-ld.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-lpuart.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-mqs.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-mt9m114.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-tianma-wvga-panel.dtb \
"
WKS_FILE_DEPENDS += "imx-boot"
