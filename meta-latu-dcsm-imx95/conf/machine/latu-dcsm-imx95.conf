# NOR flash partition layout - must match the kernel DTS fixed-partitions
# node in imx95-19x19-latu-dcsm.dts and U-Boot env (custom-bmc-env-nor.cmd).
#
# Layout (from kernel DTS fixed-partitions):
#   u-boot  0x0000000  0x002E0000 (2.875 MiB)  imx-boot container
#   kernel  0x002E0000 0x00E40000 (14.25 MiB)  Linux kernel Image.gz
#   dtb_0     0x01120000 0x00020000 (128 KB)    it6251 latu dtb
#   dtb_1     0x01140000 0x00020000 (128 KB)    latu dtb
#   dtb_2     0x01160000 0x00020000 (128 KB)    adv7535 evk dtb
#   dtb_3     0x01180000 0x00020000 (128 KB)    lt9611uxc evk dtb
#   rootfs  0x011A0000 0x02880000 (40.5 MiB)   JFFS2 root filesystem
#   total   0x03A20000 (60948480 bytes / 58.125 MiB)
#
# U-Boot bootcmd:
#   sf read ${kernel_addr_r} 0x2E0000 0xE40000
#   sf read ${fdt_addr_r} 0x1120000 0x80000
#   booti ${kernel_addr_r} - ${fdt_addr_r}
NOR_FLASH_SIZE    = "0x03A20000"
NOR_OFFSET_BOOT   = "0x00000000"
NOR_OFFSET_KERNEL = "0x002E0000"
NOR_OFFSET_DTB    = "0x01120000"
NOR_OFFSET_ROOTFS = "0x011A0000"

NOR_OFFSET_DTB_0  = "0x01120000"
NOR_OFFSET_DTB_1  = "0x01140000"
NOR_OFFSET_DTB_2  = "0x01160000"
NOR_OFFSET_DTB_3  = "0x01180000"
NOR_KERNEL_IMAGETYPE  = "Image.gz"
NOR_BOOT_BIN          = "${DEPLOY_DIR_IMAGE}/imx-boot-${MACHINE}-fspi.bin-flash_a55_flexspi"

# Use the LVDS display variant DTB in the NOR image
NOR_DTB_NAME      = "imx95-19x19-latu-dcsm-it6251-lvds0.dtb"

NOR_DTB_0_NAME    = "${DTB_BASENAME}-it6251-lvds0.dtb"
NOR_DTB_1_NAME    = "${DTB_BASENAME}.dtb"
NOR_DTB_2_NAME    = "imx95-19x19-evk-ep-adv7535.dtb"
NOR_DTB_3_NAME    = "imx95-19x19-evk-ep-mipi-4K-lt9611uxc.dtb"

# Toggle OEI/DDR settings between LATU custom and upstream EVK defaults.
# LATU_USE_CUSTOM_SRC = "1" => NXP-internal LATU DCSCM values
# LATU_USE_CUSTOM_SRC = "0" => upstream EVK values (from included imx95-19x19-lpddr5-evk.conf)
LATU_USE_CUSTOM_SRC ?= "1"

OEI_BOARD  = "${@'mx95-latu-dcscm-lp5x' if d.getVar('LATU_USE_CUSTOM_SRC') == '1' else 'mx95lp5'}"
DDR_TYPE   = "lpddr5"
OEI_DDRCONFIG = "${@'MIMX95_LPDDR5X_LATU_DCSCM_19X19_6400MTS_FW2024.09_timing' if d.getVar('LATU_USE_CUSTOM_SRC') == '1' else ''}"

IMAGE_BOOT_FILES:remove = " \
    mcore-demos/imx95-19x19-evk_m7_TCM_flexcan_linux.bin \
    mcore-demos/imx95-19x19-evk_m7_TCM_netc_share.bin \
    mcore-demos/imx95-19x19-evk_m7_TCM_power_mode_switch.bin \
    mcore-demos/imx95-19x19-evk_m7_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    mcore-demos/imx95-19x19-evk_m7_TCM_rpmsg_lite_str_echo_rtos.bin \
    mcore-demos/imx95-19x19-evk_m7_TCM_sai_low_power_audio.bin \
"
