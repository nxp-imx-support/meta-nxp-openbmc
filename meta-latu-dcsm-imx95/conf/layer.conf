# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

LAYERSERIES_COMPAT_meta_latu_dcsm_imx95 = "walnascar wrynose whinlatter"

BBFILE_COLLECTIONS += "meta_latu_dcsm_imx95"
BBFILE_PATTERN_meta_latu_dcsm_imx95 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta_latu_dcsm_imx95 = "7"

LAYERDEPENDS_meta_latu_dcsm_imx95 = "meta_frdm_imx95 nxp_layer fsl-bsp-release"
