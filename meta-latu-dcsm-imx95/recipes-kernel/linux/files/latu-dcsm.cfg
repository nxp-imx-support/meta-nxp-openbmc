# latu-dcsm-imx95 board-specific kernel config delta
# Relative to imx_v8_defconfig; other openbmc common/imx943_imx95 fragments are
# NOT applied to this machine (see linux-nxp_git.bb).
CONFIG_DRM_ITE_IT6251=y

# HW JPEG encoder/decoder (mxc-jpeg-encdec module) - required by obmc-ikvm
CONFIG_VIDEO_IMX8_JPEG=y

# FlexIO SGPIO controller (gpio-imx-flexio-sgpio module) - latu-dcsm HPM GPIO
CONFIG_GPIO_IMX_FLEXIO_SGPIO=m

# FlexIO JTAG master (jtag-imx-flexio module) - latu-dcsm HPM JTAG access
CONFIG_MISC_IMX_FLEXIO_JTAG=m

# PCIe EP VGA driver (pci-epf-imx9-vga module) - iKVM PCIe endpoint display
# stream2v4l2 depends on this and will be auto-selected
CONFIG_PCI_EPF_IMX9_VGA=m

# PCIe EP framebuffer to V4L2 bridge (stream2v4l2 module) - iKVM capture
CONFIG_VIDEO_STREAM2V4L2=m
