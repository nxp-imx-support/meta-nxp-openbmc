# NOR boot defconfig fragment for LATU_USE_CUSTOM_SRC=0 (upstream EVK kernel source)
# Uses upstream EVK DTB with adv7535 display; CONFIG_OF_UPSTREAM is not forced off.
CONFIG_DEFAULT_DEVICE_TREE="freescale/imx95-19x19-evk"
CONFIG_DEFAULT_FDT_FILE="imx95-19x19-evk-ep-adv7535.dtb"

# ENV storage: SPI NOR flash for NOR boot - disable MMC env explicitly
# CONFIG_ENV_IS_IN_MMC is not set
CONFIG_ENV_IS_IN_SPI_FLASH=y
CONFIG_ENV_OFFSET=0x49A0000
CONFIG_ENV_SECT_SIZE=0x10000
CONFIG_ENV_SIZE=0x10000
CONFIG_ENV_OFFSET_REDUND=0x49B0000
CONFIG_OF_UPSTREAM=y
# CONFIG_OF_UPSTREAM_BUILD_VENDOR is not set
# CONFIG_OF_UPSTREAM_INCLUDE_LOCAL_FALLBACK_DTBOS is not set

# Embed custom NOR boot environment at compile time
CONFIG_ENV_USE_DEFAULT_ENV_TEXT_FILE=y
CONFIG_ENV_DEFAULT_ENV_TEXT_FILE="custom-bmc-env-nor.cmd"
